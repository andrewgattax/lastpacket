<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a0c" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="yellowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#272730" stroke-width="3"/>

  <!-- Radar / Telemetry Pulse Circles -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#a855f7" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.25"/>

  <!-- Chevron Drone Arrow -->
  <g filter="url(#glow)">
    <polygon points="256,128 368,368 256,312 144,368" fill="url(#yellowGrad)"/>
    <!-- Core Accent Highlight -->
    <polygon points="256,152 336,348 256,306 176,348" fill="#fef9c3" opacity="0.25"/>
  </g>

  <!-- Center Dot -->
  <circle cx="256" cy="256" r="8" fill="#a855f7"/>
</svg>